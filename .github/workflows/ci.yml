name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  smoke:
    name: Smoke pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    env:
      CI: true
      WORKERS: '4'
      BASE_URL: ${{ vars.BASE_URL || 'https://demowebshop.tricentis.com' }}
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASS: ${{ secrets.TEST_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Secrets are available on same-repo branches but never to fork pull requests,
      # so run the credential-dependent pack only when the test account is configured.
      - name: Smoke pack (with test account)
        if: env.TEST_PASS != ''
        run: npm run test:smoke
      - name: Smoke pack (guest only, no credentials)
        if: env.TEST_PASS == ''
        run: npx playwright test --grep @smoke --project=chromium --no-deps
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            results/junit.xml
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
