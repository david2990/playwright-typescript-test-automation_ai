name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  manual-cases:
    name: Manual test cases (TC-001 to TC-003)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    permissions:
      contents: write # push the Allure report to the gh-pages branch
      pull-requests: write # Allure summary comment on pull requests
      checks: write # Allure quality gate check
    # Serialise with the daily run so both cannot push gh-pages at once.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    env:
      CI: true
      WORKERS: '4'
      BASE_URL: ${{ vars.BASE_URL || 'https://demowebshop.tricentis.com' }}
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASS: ${{ secrets.TEST_PASS }}
      ALLURE: 'on'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # TC-002 and TC-003 skip themselves (not fail) when the test account secrets
      # are absent, which is the case for pull requests from forks.
      - name: Run the three manual cases
        run: npm run test:cases
      # Allure 3 keeps run-to-run history in .allure/history.jsonl, so carry it
      # between runs; each new key restores the newest existing history first.
      - name: Restore Allure history
        if: always()
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-
      - name: Generate Allure report
        if: always() && hashFiles('allure-results/**') != ''
        run: npx allure generate allure-results -o allure-report --clean
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            results/junit.xml
          retention-days: 14
      - name: Upload Allure report
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
      # Posts the run summary table on pull requests. Fork PRs only get a read-only
      # token, so comment/check writing is skipped there instead of failing.
      - name: Allure summary comment
        if: >-
          always() && hashFiles('allure-report/summary.json') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          remote-href: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          sections: |
            new
            flaky
      # The report replaces the gh-pages content, so this also removes anything
      # a previous layout left behind.
      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && hashFiles('allure-report/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          full_commit_message: Publish manual-case report for ${{ github.sha }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
