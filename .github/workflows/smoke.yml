name: Scheduled smoke

on:
  schedule:
    # Every two hours, off the hour so it does not queue behind everyone else.
    # GitHub cron is UTC and has no Jenkins-style 'H' jitter.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: Tag or case to run
        type: choice
        options:
          - '@smoke'
          - '@regression'
          - '@tc-001'
          - '@tc-002'
          - '@tc-003'
        default: '@smoke'
      base_url:
        description: Application under test
        type: string
        default: https://demowebshop.tricentis.com
      workers:
        description: Parallel workers
        type: string
        default: '4'

permissions:
  contents: read

# Queue scheduled runs instead of cancelling a pack that is already executing.
concurrency:
  group: scheduled-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ inputs.grep || '@smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      WORKERS: ${{ inputs.workers || '4' }}
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://demowebshop.tricentis.com' }}
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASS: ${{ secrets.TEST_PASS }}
      ALLURE: 'on'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ inputs.grep || '@smoke' }}
        run: npx playwright test --grep "${{ inputs.grep || '@smoke' }}"
      # The scheduled job does not publish to GitHub Pages; CI owns that branch.
      # Uploading the report keeps every run inspectable from the run page.
      - name: Restore Allure history
        if: always()
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-history-scheduled-${{ github.run_id }}
          restore-keys: allure-history-
      - name: Generate Allure report
        if: always() && hashFiles('allure-results/**') != ''
        run: npx allure generate allure-results -o allure-report --clean
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            results/junit.xml
          retention-days: 14
      - name: Upload Allure report
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
